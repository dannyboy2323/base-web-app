name: Bootstrap

# Runs once on first push to main to configure repo settings via GitHub API.
# Safe to re-run — all operations are idempotent.
# After bootstrap completes, this workflow effectively becomes a no-op
# since the branch protection rules it creates will require PRs for future changes.

on:
  push:
    branches: [main]

jobs:
  bootstrap:
    name: Configure repository settings
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check if already bootstrapped
        id: check
        run: |
          # Check for sentinel file that marks bootstrap as complete
          if [ -f ".github/.bootstrapped" ]; then
            echo "already_bootstrapped=true" >> $GITHUB_OUTPUT
          else
            echo "already_bootstrapped=false" >> $GITHUB_OUTPUT
          fi

      - name: Create main branch ruleset
        if: steps.check.outputs.already_bootstrapped == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          echo "Creating main-protection ruleset..."
          gh api \
            --method POST \
            /repos/$REPO/rulesets \
            --input - <<'EOF'
          {
            "name": "main-protection",
            "target": "branch",
            "enforcement": "active",
            "conditions": {
              "ref_name": {
                "include": ["refs/heads/main"],
                "exclude": []
              }
            },
            "rules": [
              { "type": "deletion" },
              { "type": "non_fast_forward" },
              {
                "type": "pull_request",
                "parameters": {
                  "required_approving_review_count": 0,
                  "dismiss_stale_reviews_on_push": false,
                  "require_code_owner_review": false,
                  "require_last_push_approval": false,
                  "required_review_thread_resolution": false
                }
              },
              {
                "type": "required_status_checks",
                "parameters": {
                  "required_status_checks": [
                    {
                      "context": "test",
                      "integration_id": 15368
                    }
                  ],
                  "strict_required_status_checks_policy": false,
                  "do_not_enforce_on_create": false
                }
              }
            ],
            "bypass_actors": [
              {
                "actor_id": 5,
                "actor_type": "RepositoryRole",
                "bypass_mode": "always"
              }
            ]
          }
          EOF
          echo "✓ main-protection ruleset created"

      - name: Create staging branch ruleset
        if: steps.check.outputs.already_bootstrapped == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          echo "Creating staging-protection ruleset..."
          gh api \
            --method POST \
            /repos/$REPO/rulesets \
            --input - <<'EOF'
          {
            "name": "staging-protection",
            "target": "branch",
            "enforcement": "active",
            "conditions": {
              "ref_name": {
                "include": ["refs/heads/staging"],
                "exclude": []
              }
            },
            "rules": [
              { "type": "deletion" },
              { "type": "non_fast_forward" },
              {
                "type": "pull_request",
                "parameters": {
                  "required_approving_review_count": 0,
                  "dismiss_stale_reviews_on_push": false,
                  "require_code_owner_review": false,
                  "require_last_push_approval": false,
                  "required_review_thread_resolution": false
                }
              },
              {
                "type": "required_status_checks",
                "parameters": {
                  "required_status_checks": [
                    {
                      "context": "test",
                      "integration_id": 15368
                    }
                  ],
                  "strict_required_status_checks_policy": false,
                  "do_not_enforce_on_create": false
                }
              }
            ],
            "bypass_actors": [
              {
                "actor_id": 5,
                "actor_type": "RepositoryRole",
                "bypass_mode": "always"
              }
            ]
          }
          EOF
          echo "✓ staging-protection ruleset created"

      - name: Configure repository general settings
        if: steps.check.outputs.already_bootstrapped == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          echo "Configuring repository settings..."
          gh api \
            --method PATCH \
            /repos/$REPO \
            --field allow_squash_merge=true \
            --field allow_merge_commit=false \
            --field allow_rebase_merge=false \
            --field delete_branch_on_merge=true \
            --field allow_auto_merge=true
          echo "✓ Repository settings configured"

      - name: Mark bootstrap complete
        if: steps.check.outputs.already_bootstrapped == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          echo "Bootstrap completed on $(date -u)" > /tmp/bootstrapped
          # We can't commit directly due to branch protection, so just log completion
          echo "✓ Bootstrap complete — repo is configured"
          echo ""
          echo "Summary:"
          echo "  ✓ main-protection ruleset created"
          echo "  ✓ staging-protection ruleset created"
          echo "  ✓ Squash-only merges enabled"
          echo "  ✓ Auto-delete branches enabled"
          echo "  ✓ Auto-merge enabled"
          echo ""
          echo "Note: Branch protection is now active on main."
          echo "All future changes must go through pull requests."
